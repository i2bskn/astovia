version: "2"
sql:
  - engine: sqlite
    schema: db/sqlite/schema.sql
    queries: db/sqlite/queries.sql
    gen:
      go:
        package: sqlitedb
        out: internal/store/sqlitedb
        overrides:
          - column: sessions.revoked_at
            go_type:
              import: database/sql
              type: NullInt64
          - column: refresh_tokens.consumed_at
            go_type:
              import: database/sql
              type: NullInt64
          - column: action_items.note
            go_type:
              import: database/sql
              type: NullString
          - column: action_items.due_at
            go_type:
              import: database/sql
              type: NullInt64
          - column: api_tokens.last_used_at
            go_type:
              import: database/sql
              type: NullInt64
          - column: oauth_clients.secret_hash
            go_type:
              import: database/sql
              type: NullString
          - column: oauth_clients.metadata_expires_at
            go_type:
              import: database/sql
              type: NullInt64
          - column: oauth_grants.code_used_at
            go_type:
              import: database/sql
              type: NullInt64
          - column: oauth_grants.last_used_at
            go_type:
              import: database/sql
              type: NullInt64
  - engine: postgresql
    schema: db/postgres/schema.sql
    queries: db/postgres/queries.sql
    gen:
      go:
        package: postgresdb
        out: internal/store/postgresdb
        sql_package: database/sql
